name: Validate Windows application

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Local tests and packaged GUI
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install and check dependencies
        shell: pwsh
        run: |
          python -m pip install -r requirements-build.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          exit $LASTEXITCODE
      - name: Compile Python and check whitespace
        shell: pwsh
        run: |
          python -m compileall -q app tests run_gui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git show --format= --check HEAD
          exit $LASTEXITCODE
      - name: Offline tests in Windows PowerShell
        shell: powershell
        run: |
          .\tests\run_tests.ps1 -Suite Local
          exit $LASTEXITCODE
      - name: Build and smoke-test executable without credentials
        shell: pwsh
        run: .\tools\build_gui.ps1
